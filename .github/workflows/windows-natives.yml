# jar に同梱する Windows 用ネイティブを用意し、テストまで通す。
#
# ネイティブは原則 whisper.cpp の公式リリースから取る（scripts/download-natives.ps1）。
# そのタグに Windows バイナリが添付されていない場合だけ、submodule を本家の CMake で
# ビルドする（scripts/build-whisper.ps1）。どちらを使ったかはログに出る。
#
# 成果物は Artifacts の windows-x64-natives に出る。手元に CMake や MSVC が無くても
# DLL を入手できる。
name: Windows natives

on:
    workflow_dispatch:
    push:
        branches: [main]
        tags: ['v*']
        # ドキュメントだけの変更では走らせない。コードとビルド設定は全部見る
        # （以前は src/main/java/jp/clip/whisper/ffm/** だけだったので、WhisperEngine や
        #  NativeSession を直しても CI が走らなかった）。
        paths:
            - 'src/**'
            - 'scripts/**'
            - 'build.gradle'
            - 'settings.gradle'
            - 'gradle.properties'
            - 'gradle/**'
            - '.github/workflows/windows-natives.yml'

# 既定のトークンは読み取りだけなので、テスト結果を Checks に書く action_junit_report が
# 「Resource not accessible by integration」でログにエラーを残す。必要な権限だけ明示する。
permissions:
    contents: read
    checks: write

jobs:
    natives:
        runs-on: windows-latest
        steps:
            -   uses: actions/checkout@v4
                with:
                    # 公式バイナリが無いバージョンでは submodule から CMake でビルドするので
                    # 中の依存（ggml 等）まで必要。recursive にしておく。
                    submodules: recursive
            -   uses: actions/setup-java@v5
                with:
                    java-version: 25
                    distribution: 'temurin'

            # shell は pwsh（PowerShell 7）を使う。shell: powershell（5.1）だと、Actions が
            # YAML から書き出すスクリプトを BOM 無し = ANSI として読むため非 ASCII が化け、
            # 引用符の対応が崩れる（The string is missing the terminator: " で落ちた）。
            # ここに書くメッセージも念のため ASCII に留める。
            #
            # 成否の判定は終了コードではなく「natives\whisper.dll ができたか」で行う。
            # 呼ぶスクリプトが終了エラーを投げるかどうかに依存しないため、この方が壊れにくい。
            # v1.9.3 には公式の Windows バイナリが無いので、実際には毎回ビルド側を通る。
            -   name: Fetch natives (official release, fall back to building the submodule)
                shell: pwsh
                run: |
                    $ErrorActionPreference = 'Continue'
                    try { & .\scripts\download-natives.ps1 } catch { Write-Host "download step raised: $_" }

                    if(Test-Path 'natives\whisper.dll')
                    {
                        Write-Host "Using the official release binaries"
                    }
                    else
                    {
                        Write-Host "No official binaries for this tag - building the submodule instead"
                        & .\scripts\build-whisper.ps1
                        if($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
                        if(-not (Test-Path 'natives\whisper.dll')) { throw "natives\whisper.dll was not produced" }
                    }

                    Get-ChildItem natives -File | ForEach-Object { Write-Host ("  {0} ({1:N0} bytes)" -f $_.Name, $_.Length) }

            -   name: Download test models
                shell: pwsh
                run: |
                    .\scripts\download-test-model.ps1
                    .\scripts\download-vad-model.ps1
                    Move-Item .\ggml-silero-v6.2.0.bin .\src\main\resources\ -Force

            -   name: Test
                run: ./gradlew test

            -   name: Publish test report
                uses: mikepenz/action-junit-report@v5
                if: success() || failure()
                with:
                    report_paths: '**/build/test-results/**/*.xml'

            # 利用側アプリ（transcribe-shell 等）は natives/ を持たず、jar の中の <os>-<arch>/ から
            # DLL を取り出して読み込む。test タスクは natives/ があればそちらを使うので、
            # この経路だけは一度も検証されていなかった。詳細は BundledNativesSmoke の Javadoc。
            -   name: Smoke test the natives bundled in the jar
                run: ./gradlew installNatives jar smokeTestBundledNatives

            # スモークが落ちたときも DLL は手元で調べたいので、失敗しても上げる
            -   name: Upload natives
                uses: actions/upload-artifact@v4
                if: success() || failure()
                with:
                    name: windows-x64-natives
                    path: natives/*.dll
                    retention-days: 30
